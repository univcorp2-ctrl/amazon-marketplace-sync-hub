<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Amazon Marketplace Sync Hub</title>
  <style>
    :root{--bg:#07111f;--panel:#0f1d30;--line:#263a55;--text:#edf5ff;--muted:#9cb0c9;--blue:#4ba3ff;--green:#48d597;--amber:#ffbf5f;--red:#ff7185}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#17365c 0,#07111f 45%);color:var(--text);font-family:Inter,system-ui,-apple-system,"Noto Sans JP",sans-serif}header,main{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:clamp(28px,5vw,52px);margin:0;letter-spacing:-.04em}.eyebrow{color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:12px}.badge{border:1px solid var(--line);background:#0b1728;padding:9px 12px;border-radius:999px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.panel{background:rgba(15,29,48,.92);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.22)}.wide{grid-column:1/-1}.panel h2{margin:0 0 14px;font-size:19px}.row{display:flex;gap:10px;flex-wrap:wrap}.field{display:grid;gap:7px;flex:1;min-width:180px}label{font-size:12px;color:var(--muted);font-weight:700}input,textarea,select{width:100%;border:1px solid var(--line);background:#081525;color:var(--text);border-radius:12px;padding:12px;font:inherit}textarea{min-height:92px;resize:vertical}button{border:0;border-radius:12px;padding:12px 16px;font-weight:850;cursor:pointer;background:var(--blue);color:#05101d}button.secondary{background:#1b2c44;color:var(--text);border:1px solid var(--line)}button.green{background:var(--green)}button:disabled{opacity:.45;cursor:not-allowed}.notice{margin-top:14px;border-left:4px solid var(--amber);background:#2b2213;padding:12px 14px;border-radius:8px;color:#ffe0a8;font-size:13px;line-height:1.55}.status{font-size:13px;color:var(--muted);min-height:22px;margin-top:10px}.ok{color:var(--green)}.error{color:var(--red)}.product{display:grid;grid-template-columns:150px 1fr;gap:18px}.product img{width:150px;height:150px;object-fit:contain;background:white;border-radius:16px}.price{font-size:32px;font-weight:900}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{font-size:12px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.product{grid-template-columns:1fr}.product img{width:100%;height:220px}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<header><div><div class="eyebrow">production-safe marketplace operations</div><h1>Amazon → Shopee</h1><p style="color:var(--muted);max-width:760px">Amazon SP-APIで価格と販売可否を確認し、販売者が権利を持つ商品名・説明・画像だけをShopeeへ登録します。</p></div><div class="badge" id="mode">接続確認中</div></header>
<main><div class="grid">
  <section class="panel wide"><h2>API接続</h2><div class="row"><div class="field"><label>Backend API URL</label><input id="apiBase" placeholder="Pages利用時のみ https://api.example.com" /></div><div class="field"><label>API token（sessionStorageのみ）</label><input id="apiToken" type="password" autocomplete="off" /></div><div style="align-self:end"><button class="secondary" id="connect">接続確認</button></div></div><div class="status" id="connectStatus"></div></section>
  <section class="panel"><h2>1. Amazon商品を確認</h2><div class="row"><div class="field"><label>ASIN</label><input id="asin" value="B0DEMO1234" maxlength="10" /></div><div style="align-self:end"><button id="fetch">取得する</button></div></div><div class="status" id="fetchStatus"></div><div id="product"></div></section>
  <section class="panel"><h2>安全ポリシー</h2><div class="notice">Amazonの正確な残り在庫数は取得できません。オファー有無だけを販売可否として使い、在庫は1件から開始します。Amazon由来の画像・説明は本番では自動転用しません。</div></section>
  <section class="panel wide"><h2>2. Shopee出品内容</h2><div class="row"><div class="field"><label>Shopee category_id</label><input id="shopeeCategory" type="number" placeholder="必須" /></div><div class="field"><label>Seller SKU</label><input id="sellerSku" placeholder="省略時 AMZ-ASIN" /></div><div class="field"><label>販売価格（任意・対象通貨）</label><input id="priceOverride" type="number" min="1" /></div><div class="field"><label>初期在庫（0〜100）</label><input id="stockOverride" type="number" min="0" max="100" value="1" /></div></div><div class="field" style="margin-top:12px"><label>自社の商品名</label><input id="title" maxlength="120" placeholder="本番では必須" /></div><div class="field" style="margin-top:12px"><label>自社の商品説明</label><textarea id="description" placeholder="本番では必須"></textarea></div><div class="field" style="margin-top:12px"><label>権利保有画像URL（HTTPS、1行1件）</label><textarea id="images" placeholder="https://cdn.example.com/product-1.jpg"></textarea></div><label style="display:flex;gap:9px;align-items:flex-start;margin:14px 0;color:var(--text)"><input id="rights" type="checkbox" style="width:auto;margin-top:3px">商品名・説明・画像をShopeeで利用する権利を保有し、出品規約・ブランド承認・禁制品・配送条件を確認しました。</label><div class="row"><button class="green" id="list">Shopeeへ出品</button><button class="secondary" id="sync">価格・販売可否を同期</button></div><div class="status" id="listStatus"></div></section>
  <section class="panel wide"><h2>出品・同期履歴</h2><div style="overflow:auto"><table><thead><tr><th>Channel</th><th>SKU</th><th>Price</th><th>Stock</th><th>Status</th></tr></thead><tbody id="listings"></tbody></table></div></section>
</div></main>
<script>
const API_BASE = "";
const $ = id => document.getElementById(id);
let current = null; let demo = false;
const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function base(){return ($("apiBase").value.trim() || API_BASE).replace(/\/$/,"");}
function token(){return $("apiToken").value.trim();}
async function api(path, options={}){const headers={"Content-Type":"application/json",...(options.headers||{})};if(token())headers.Authorization=`Bearer ${token()}`;const r=await fetch(`${base()}${path}`,{...options,headers});let body={};try{body=await r.json()}catch{}if(!r.ok)throw new Error(body.detail||r.statusText);return body;}
function demoProduct(asin){return {asin,title:`デモ商品 ${asin}`,brand:"Demo Brand",price:3980,currency:"JPY",available:true,images:["https://placehold.co/800x800/png?text=Demo+Product"],source:"pages-demo",availability_note:"Backend API URL is not configured."};}
function safeImage(url){try{const parsed=new URL(url);return parsed.protocol==="https:"?parsed.href:""}catch{return ""}}
function renderProduct(p){current=p;const image=safeImage(p.images?.[0])||"https://placehold.co/800x800?text=No+Image";$("product").innerHTML=`<div class="product" style="margin-top:18px"><img src="${esc(image)}" alt=""><div><div class="eyebrow">${esc(p.source)}</div><h2 style="font-size:25px;margin:6px 0">${esc(p.title)}</h2><div class="price">${p.price?new Intl.NumberFormat('ja-JP',{style:'currency',currency:p.currency||'JPY'}).format(p.price):'価格なし'}</div><div class="meta"><span class="chip">ASIN ${esc(p.asin)}</span><span class="chip">${p.available?'販売可能':'販売不可'}</span><span class="chip">${esc(p.brand||'Brand unknown')}</span></div><p style="color:var(--muted);font-size:12px">${esc(p.availability_note||'')}</p></div></div>`;}
async function health(){sessionStorage.setItem("marketApiBase",$("apiBase").value);sessionStorage.setItem("marketApiToken",token());try{const h=await api('/api/health');$("mode").textContent=`${h.mode} / ${h.status}`;demo=h.mode==='demo';$("connectStatus").textContent=h.missing_config?.length?`不足設定: ${h.missing_config.join(', ')}`:'接続しました';$("connectStatus").className=`status ${h.missing_config?.length?'error':'ok'}`;if(!demo)await loadListings();}catch(e){demo=!base();$("mode").textContent=demo?'Cloudflare Pages デモ':'接続失敗';$("connectStatus").textContent=e.message;$("connectStatus").className='status error';}}
$("connect").onclick=health;
$("fetch").onclick=async()=>{const asin=$("asin").value.trim().toUpperCase();$("fetchStatus").textContent="取得中…";try{const p=demo?demoProduct(asin):await api(`/api/products/${encodeURIComponent(asin)}/fetch`,{method:'POST'});renderProduct(p);$("fetchStatus").textContent="取得しました";$("fetchStatus").className="status ok";}catch(e){$("fetchStatus").textContent=e.message;$("fetchStatus").className="status error";}};
$("list").onclick=async()=>{if(!current){$("listStatus").textContent="先に商品を取得してください";return}const body={asin:current.asin,channels:['shopee'],rights_confirmed:$("rights").checked,title:$("title").value.trim()||null,description:$("description").value.trim()||null,image_urls:$("images").value.split(/\n+/).map(x=>x.trim()).filter(Boolean),seller_sku:$("sellerSku").value.trim()||null,shopee_category_id:Number($("shopeeCategory").value)||null,price_override:Number($("priceOverride").value)||null,stock_override:$("stockOverride").value===''?null:Number($("stockOverride").value)};try{if(demo){if(!body.rights_confirmed)throw new Error('権利確認が必要です');$("listStatus").textContent="デモ出品を作成しました（外部APIへの送信なし）";}else{await api('/api/listings',{method:'POST',body:JSON.stringify(body)});$("listStatus").textContent="出品処理が完了しました";await loadListings()}$("listStatus").className="status ok";}catch(e){$("listStatus").textContent=e.message;$("listStatus").className="status error";}};
$("sync").onclick=async()=>{try{if(!demo)await api('/api/sync/run',{method:'POST'});$("listStatus").textContent=demo?'デモ同期を実行しました':'同期が完了しました';$("listStatus").className='status ok';await loadListings()}catch(e){$("listStatus").textContent=e.message;$("listStatus").className='status error';}};
async function loadListings(){if(demo)return;const rows=await api('/api/listings');$("listings").innerHTML=rows.map(x=>`<tr><td>${esc(x.channel)}</td><td>${esc(x.seller_sku)}</td><td>${esc(x.target_price)}</td><td>${esc(x.target_stock)}</td><td>${esc(x.status)}</td></tr>`).join('');}
$("apiBase").value=sessionStorage.getItem("marketApiBase")||API_BASE;$("apiToken").value=sessionStorage.getItem("marketApiToken")||"";health();
</script>
</body></html>
