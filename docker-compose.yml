services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SHOPEE_TOKEN_STATE_FILE: /app/secrets/shopee-token-state.json
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
